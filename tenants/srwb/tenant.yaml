# MadziHub tenant configuration: Southern Region Water Board (reference installation)
#
# Values below were moved out of the code unchanged so SRWB's outputs stay identical.
#   targets.nrw_pct   : single NRW target used by panels, reports and insights.
#                       NOTE: the Strategic Plan sets a per-year NRW target
#                       (27 -> 26.5 -> 26 -> 25.5 -> 25). Versioned per-year targets
#                       arrive with the Stage 2 targets table.
#   thresholds        : alert thresholds used by the insights engine.
#   strategic_plan    : transcribed verbatim from the approved SRWB Strategic Plan 2023-2028.
#   ai.enabled        : true preserves current behaviour (narratives run when data/groq.key exists).
