# EWURA Water Utilities Performance Review, FY 2023/24 — DRAFT pack, NOT approved for scoring.
#
# What was verified (MadziHub team, 25 Sep 2026) from the text of the cited report (Part III):
#  - Overall ranking score = KPI score + score for Compliance with Regulatory Requirements (CRR).
#  - Each KPI's score is the sum of four component scores — best performer (SBP, interpolated
#    between minimum, national median and best), attainment of the business-plan target (SPT),
#    confidence grading (SCG, data reliability A/B/C and accuracy bands) and attainment of the
#    service-level benchmark (SSLB) — multiplied by the KPI's weight (Table "Key Performance
#    Indicator Weights").
#  - Utilities are ranked within clusters I, II and III; a separate "utility ranking" sums target
#    attainment only.
#  - The KPI names and CRR obligations listed below.
# NOT verified: every number — the KPI/CRR shares (the research benchmark records 60% / 40%; the
# digits in this PDF's text layer could not be read), KPI weights, boundaries, benchmarks and the
# points for each component and obligation. MadziHub's engine scores one rule per indicator; the
# four-component KPI method needs the "components" extension before this pack can be approved.
