# Alembic settings for MadziHub.
#
# Operators should normally use `python -m app.migrate status|upgrade|adopt`, which
# backs up SQLite databases first. Developers use the plain alembic CLI to author
# revisions, e.g.  alembic revision --autogenerate -m "add plans"
#
# The database URL is NOT set here: app/migrations/env.py uses the app's own
# engine, i.e. DATABASE_URL / MADZI_TENANT from the environment or .env.

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
